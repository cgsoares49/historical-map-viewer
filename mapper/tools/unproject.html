<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map Un-projector</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #1e1e1e;
    color: #eee;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #left {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #canvasWrap {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background:
      repeating-conic-gradient(#2b2b2b 0% 25%, #232323 0% 50%) 50% / 20px 20px;
  }
  canvas#view {
    position: absolute;
    top: 0;
    left: 0;
    cursor: grab;
  }
  #status {
    padding: 6px 12px;
    font-size: 12px;
    color: #999;
    background: #2a2a2a;
    border-top: 1px solid #444;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #right {
    width: 380px;
    flex: 0 0 auto;
    background: #252525;
    border-left: 1px solid #444;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .section {
    padding: 10px 12px;
    border-bottom: 1px solid #3a3a3a;
  }
  .section h3 {
    margin: 0 0 8px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #999;
  }
  label.filebtn {
    display: inline-block;
    background: #3a6ea5;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 6px;
  }
  label.filebtn:hover { background: #4a7eb5; }
  input[type=file] { display: none; }
  .fileInfo { font-size: 12px; color: #aaa; margin-left: 4px; }
  .row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  .row label { flex: 0 0 90px; font-size: 12px; color: #ccc; }
  .row input[type=number], .row input[type=text] {
    flex: 1 1 auto;
    background: #1e1e1e;
    border: 1px solid #444;
    color: #eee;
    padding: 4px 6px;
    border-radius: 3px;
    font-size: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { padding: 3px 4px; border-bottom: 1px solid #3a3a3a; text-align: left; white-space: nowrap; }
  th { background: #2a2a2a; }
  .num { color: #aaa; font-family: monospace; }
  button.primary {
    width: 100%;
    background: #3a8a5a;
    color: #fff;
    border: none;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  button.primary:hover { background: #4a9a6a; }
  button.primary:disabled { background: #555; cursor: default; }
  button.secondary {
    width: 100%;
    background: #3a5a8a;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-top: 6px;
  }
  button.secondary:hover { background: #4a6a9a; }
  button.secondary:disabled { background: #555; cursor: default; }
  #progressWrap {
    height: 6px;
    background: #1e1e1e;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
    display: none;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: #4a9a6a;
  }
  .checkboxCell { text-align: center; }
  #ptsEmpty { color: #777; font-size: 12px; padding: 6px 0; }
  .cellEdit {
    width: 48px;
    background: #1e1e1e;
    border: 1px solid #444;
    color: #eee;
    font-size: 10px;
    padding: 2px 3px;
    border-radius: 2px;
  }
  .pairCell { display: flex; gap: 3px; }
  .delBtn { background: none; border: none; color: #d55; cursor: pointer; font-size: 13px; }
  .delBtn:hover { color: #f66; }
  #fitReportText { font-size: 11px; color: #ccc; margin-bottom: 6px; line-height: 1.4; }
</style>
</head>
<body>

<div id="left">
  <div id="canvasWrap">
    <canvas id="view"></canvas>
  </div>
  <div id="status">Load a source image and a control-points CSV to begin.</div>
</div>

<div id="right">

  <div class="section">
    <h3>1. Source Image</h3>
    <label class="filebtn">Load Image
      <input type="file" id="imgInput" accept="image/*">
    </label>
    <span class="fileInfo" id="imgInfo"></span>
  </div>

  <div class="section">
    <h3>2. Control Points CSV</h3>
    <label class="filebtn">Load CSV
      <input type="file" id="csvInput" accept=".csv,text/csv">
    </label>
    <span class="fileInfo" id="csvInfo"></span>
    <div id="ptsEmpty">No points loaded yet.</div>
    <table id="ptsTable" style="display:none;">
      <thead>
        <tr><th></th><th>Referent</th><th>px, py</th><th>lat, lon</th>
          <th title="Residual from the best-fit LINEAR (equirectangular) model — used only to decide Linear vs TPS">lin resid(px)</th>
          <th title="TPS leave-one-out error: refit TPS without this point, then see how far its own prediction lands. TPS's direct/in-sample residual is always ~0 by construction (it's an exact interpolant), so it can't reveal overfitting — this can.">TPS LOO(px)</th>
          <th></th></tr>
      </thead>
      <tbody id="ptsBody"></tbody>
    </table>
  </div>

  <div class="section" id="fitReportSection" style="display:none;">
    <h3>Fit Quality</h3>
    <div id="fitReportText"></div>
  </div>

  <div class="section">
    <h3>3. Target Bounding Box <span style="color:#888; text-transform:none;">(used only for Force TPS Warp)</span></h3>
    <div class="row"><label>North lat</label><input type="number" id="bboxN" value="40" step="0.01"></div>
    <div class="row"><label>South lat</label><input type="number" id="bboxS" value="35.6" step="0.01"></div>
    <div class="row"><label>West lon</label><input type="number" id="bboxW" value="-9.6" step="0.01"></div>
    <div class="row"><label>East lon</label><input type="number" id="bboxE" value="-0.3" step="0.01"></div>
    <div class="row"><label>Output width</label><input type="number" id="outW" value="3000" step="50"></div>
  </div>

  <div class="section">
    <h3>4. Process</h3>
    <button class="primary" id="useLinearBtn" disabled>Use Linear (no resample)</button>
    <button class="secondary" id="warpBtn" disabled>Force TPS Warp</button>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <label style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px;">
      <input type="checkbox" id="graticule"> Show 1&deg; graticule overlay
    </label>
    <button class="secondary" id="downloadBtn" disabled>Download</button>
  </div>

</div>

<script>
// ─────────────────────────── state ───────────────────────────
let srcImg = null, srcCtx = null, srcImageData = null, srcImgFile = null;
let points = []; // {label, px, py, lat, lon, include, residPx}
let resultCanvas = null;   // full-res warped result (no graticule baked in); null when using the linear (unresampled) path
let resultBounds = null;   // {north,south,west,east,pxPerDeg,w,h}
let fitReport = null;      // {lonFit:{a,b}, latFit:{a,b}, rmsPx, pctSpan, recommendLinear}
const LINEAR_THRESHOLD_PCT = 0.5;

const view = document.getElementById('view');
const vctx = view.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const statusEl = document.getElementById('status');

let viewScale = 1, viewOffX = 0, viewOffY = 0;
let currentBitmap = null; // ImageBitmap-ish source for the view (source or result)

function resizeView() {
  view.width = wrap.clientWidth;
  view.height = wrap.clientHeight;
  renderView();
}
window.addEventListener('resize', resizeView);
resizeView();

function fitView() {
  if (!currentBitmap) return;
  const availW = wrap.clientWidth * 0.94;
  const availH = wrap.clientHeight * 0.94;
  viewScale = Math.min(availW / currentBitmap.width, availH / currentBitmap.height, 1);
  viewOffX = (wrap.clientWidth - currentBitmap.width * viewScale) / 2;
  viewOffY = (wrap.clientHeight - currentBitmap.height * viewScale) / 2;
  renderView();
}

function renderView() {
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.clearRect(0, 0, view.width, view.height);
  if (!currentBitmap) return;
  vctx.imageSmoothingEnabled = viewScale < 1;
  vctx.drawImage(currentBitmap, viewOffX, viewOffY,
    currentBitmap.width * viewScale, currentBitmap.height * viewScale);

  if (document.getElementById('graticule').checked && resultBounds &&
      (currentBitmap === resultCanvas || currentBitmap === (srcCtx && srcCtx.canvas))) {
    drawGraticule();
  }
}

function drawGraticule() {
  const { north, south, west, east, pxPerDeg } = resultBounds;
  vctx.save();
  vctx.strokeStyle = 'rgba(255,220,0,0.55)';
  vctx.lineWidth = 1;
  vctx.font = '10px monospace';
  vctx.fillStyle = 'rgba(255,220,0,0.85)';

  const lonStart = Math.ceil(west);
  for (let lon = lonStart; lon <= east; lon++) {
    const ix = (lon - west) * pxPerDeg;
    const sx = ix * viewScale + viewOffX;
    vctx.beginPath();
    vctx.moveTo(sx, viewOffY);
    vctx.lineTo(sx, viewOffY + currentBitmap.height * viewScale);
    vctx.stroke();
    vctx.fillText(lon + '°', sx + 2, viewOffY + 12);
  }
  const latStart = Math.ceil(south);
  for (let lat = latStart; lat <= north; lat++) {
    const iy = (north - lat) * pxPerDeg;
    const sy = iy * viewScale + viewOffY;
    vctx.beginPath();
    vctx.moveTo(viewOffX, sy);
    vctx.lineTo(viewOffX + currentBitmap.width * viewScale, sy);
    vctx.stroke();
    vctx.fillText(lat + '°', viewOffX + 2, sy - 2);
  }
  vctx.restore();
}

// pan / zoom (view only, no point placement)
let dragging = false;
view.addEventListener('mousedown', (e) => {
  dragging = true;
  view.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', () => { dragging = false; view.style.cursor = 'grab'; });
window.addEventListener('mousemove', (e) => {
  if (dragging) {
    viewOffX += e.movementX;
    viewOffY += e.movementY;
    renderView();
  }
});
view.addEventListener('wheel', (e) => {
  if (!currentBitmap) return;
  e.preventDefault();
  const rect = view.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const ix = (sx - viewOffX) / viewScale, iy = (sy - viewOffY) / viewScale;
  // Scale the zoom step by actual wheel/gesture magnitude (not just sign) so a
  // trackpad's many small-delta events don't compound into runaway zoom.
  const factor = Math.exp(-e.deltaY * 0.0015);
  viewScale = Math.min(Math.max(viewScale * factor, 0.02), 40);
  viewOffX = sx - ix * viewScale;
  viewOffY = sy - iy * viewScale;
  renderView();
}, { passive: false });
wrap.addEventListener('dblclick', fitView);

// ─────────────────────────── load image ───────────────────────────
document.getElementById('imgInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  srcImgFile = file;
  const url = URL.createObjectURL(file);
  const image = new Image();
  image.onload = () => {
    srcImg = image;
    const off = document.createElement('canvas');
    off.width = image.naturalWidth;
    off.height = image.naturalHeight;
    srcCtx = off.getContext('2d');
    srcCtx.drawImage(image, 0, 0);
    srcImageData = srcCtx.getImageData(0, 0, off.width, off.height);
    document.getElementById('imgInfo').textContent =
      `${file.name} (${off.width}x${off.height})`;
    currentBitmap = off;
    resultCanvas = null;
    resultBounds = null;
    fitView();
    computeFit();
  };
  image.src = url;
});

// ─────────────────────────── load CSV ───────────────────────────
document.getElementById('csvInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    points = parseCsv(reader.result);
    document.getElementById('csvInfo').textContent = `${file.name} — ${points.length} rows`;
    computeFit();
  };
  reader.readAsText(file);
});

function parseCsvLine(line) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) return [];
  const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const idx = {
    referent: header.indexOf('referent'),
    px: header.indexOf('pixel_x'),
    py: header.indexOf('pixel_y'),
    lat: header.indexOf('lat'),
    lon: header.indexOf('lon'),
  };
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = parseCsvLine(lines[i]);
    const px = parseFloat(cols[idx.px]);
    const py = parseFloat(cols[idx.py]);
    const lat = parseFloat(cols[idx.lat]);
    const lon = parseFloat(cols[idx.lon]);
    if (isNaN(px) || isNaN(py) || isNaN(lat) || isNaN(lon)) continue;
    rows.push({
      label: idx.referent >= 0 ? (cols[idx.referent] || '') : '',
      px, py, lat, lon, include: true,
    });
  }
  return rows;
}

function onPointsChanged() {
  computeFit();
}

function makePairCell(v1, v2, decimals, onCommit1, onCommit2) {
  const td = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'pairCell';
  const mk = (val, onCommit) => {
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = 'any';
    inp.value = val.toFixed(decimals);
    inp.className = 'cellEdit';
    inp.addEventListener('change', () => {
      const v = parseFloat(inp.value);
      if (!isNaN(v)) onCommit(v);
      onPointsChanged();
    });
    return inp;
  };
  wrap.appendChild(mk(v1, onCommit1));
  wrap.appendChild(mk(v2, onCommit2));
  td.appendChild(wrap);
  return td;
}

function renderPtsTable() {
  const body = document.getElementById('ptsBody');
  const table = document.getElementById('ptsTable');
  const empty = document.getElementById('ptsEmpty');
  body.innerHTML = '';
  if (points.length === 0) {
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  table.style.display = 'table';
  empty.style.display = 'none';
  points.forEach((p) => {
    const tr = document.createElement('tr');
    const tdChk = document.createElement('td');
    tdChk.className = 'checkboxCell';
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = p.include;
    chk.addEventListener('change', () => { p.include = chk.checked; onPointsChanged(); });
    tdChk.appendChild(chk);
    tr.appendChild(tdChk);

    const tdLabel = document.createElement('td');
    tdLabel.textContent = p.label || '—';
    tr.appendChild(tdLabel);

    tr.appendChild(makePairCell(p.px, p.py, 1, v => p.px = v, v => p.py = v));
    tr.appendChild(makePairCell(p.lat, p.lon, 5, v => p.lat = v, v => p.lon = v));

    const tdResid = document.createElement('td');
    tdResid.className = 'num';
    if (typeof p.residPx === 'number') {
      tdResid.textContent = p.residPx.toFixed(1);
      if (fitReport && p.residPx > Math.max(3 * fitReport.medianResidPx, 8)) {
        tdResid.style.color = '#e06060';
        tdResid.title = 'Possible outlier — consider excluding or correcting this point';
      }
    } else {
      tdResid.textContent = '—';
    }
    tr.appendChild(tdResid);

    const tdLoo = document.createElement('td');
    tdLoo.className = 'num';
    if (typeof p.looPx === 'number') {
      tdLoo.textContent = p.looPx.toFixed(1);
      if (fitReport && fitReport.tpsLoo && p.looPx > Math.max(3 * fitReport.tpsLoo.medianLoo, 8)) {
        tdLoo.style.color = '#e06060';
        tdLoo.title = 'Poorly predicted by the surrounding points when held out — the TPS fit may be bending sharply (overfitting) to pass through this point exactly. Consider double-checking or excluding it.';
      }
    } else {
      tdLoo.textContent = '—';
    }
    tr.appendChild(tdLoo);

    const tdDel = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'delBtn';
    delBtn.title = 'Remove point';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => {
      points = points.filter(pt => pt !== p);
      onPointsChanged();
    });
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);

    body.appendChild(tr);
  });
}

function median(nums) {
  const s = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// Simple least-squares fit of y = a + b*x.
function fitLinearAxis(xs, ys) {
  const n = xs.length;
  const meanX = xs.reduce((s, v) => s + v, 0) / n;
  const meanY = ys.reduce((s, v) => s + v, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (xs[i] - meanX) * (ys[i] - meanY);
    den += (xs[i] - meanX) * (xs[i] - meanX);
  }
  const b = den < 1e-12 ? 0 : num / den;
  const a = meanY - b * meanX;
  return { a, b };
}

// Fits an axis-aligned linear (equirectangular) model from lon~f(px), lat~f(py)
// using currently-included points, then scores every point's residual against it.
// A low residual means the control points are consistent with a simple linear
// scale (no warp needed); a high residual means real projection distortion.
function computeFit() {
  const section = document.getElementById('fitReportSection');
  const included = points.filter(p => p.include);

  if (!srcImg || included.length < 2) {
    fitReport = null;
    points.forEach(p => { delete p.residPx; delete p.looPx; });
    section.style.display = 'none';
    renderPtsTable();
    updateWarpEnabled();
    return;
  }

  const lonFit = fitLinearAxis(included.map(p => p.px), included.map(p => p.lon));
  const latFit = fitLinearAxis(included.map(p => p.py), included.map(p => p.lat));

  let sumSq = 0;
  points.forEach(p => {
    const lonResidPx = lonFit.b ? (p.lon - (lonFit.a + lonFit.b * p.px)) / lonFit.b : 0;
    const latResidPx = latFit.b ? (p.lat - (latFit.a + latFit.b * p.py)) / latFit.b : 0;
    p.residPx = Math.hypot(lonResidPx, latResidPx);
    if (p.include) sumSq += p.residPx * p.residPx;
  });
  const rmsPx = Math.sqrt(sumSq / included.length);
  const medianResidPx = median(included.map(p => p.residPx));
  const spanPx = srcImageData.width;
  const pctSpan = (rmsPx / spanPx) * 100;
  const recommendLinear = pctSpan <= LINEAR_THRESHOLD_PCT;

  // TPS leave-one-out diagnostics — see computeTpsLoo() for why raw TPS
  // residual (always ~0) can't be used for this instead.
  points.forEach(p => { delete p.looPx; });
  let tpsLoo = null;
  const looVals = computeTpsLoo(included);
  if (looVals) {
    included.forEach((p, i) => { p.looPx = looVals[i]; });
    tpsLoo = {
      meanLoo: looVals.reduce((s, v) => s + v, 0) / looVals.length,
      medianLoo: median(looVals),
      maxLoo: Math.max(...looVals),
      n: looVals.length,
    };
  }

  fitReport = { lonFit, latFit, rmsPx, medianResidPx, pctSpan, recommendLinear, tpsLoo };

  section.style.display = 'block';
  document.getElementById('fitReportText').innerHTML =
    `<div><strong>Linear fit</strong> — RMS residual from best-fit linear (equirectangular) mapping: ${rmsPx.toFixed(1)}px ` +
    `(${pctSpan.toFixed(2)}% of image width, threshold ${LINEAR_THRESHOLD_PCT}%) using ` +
    `${included.length} of ${points.length} points — ` +
    (recommendLinear
      ? 'looks equirectangular. "Use Linear" is recommended.'
      : 'nonlinear distortion detected. "Force TPS Warp" is recommended.') +
    `</div>` +
    (tpsLoo
      ? `<div style="margin-top:6px;"><strong>TPS overfit check</strong> — TPS passes through every included point exactly, ` +
        `so its own residual is always ≈0 and can't tell you if the surface is wiggling between points to do it. ` +
        `Leave-one-out cross-validation (refit without each point, then see how far off the surface's own prediction lands) ` +
        `gives median ${tpsLoo.medianLoo.toFixed(1)}px, max ${tpsLoo.maxLoo.toFixed(1)}px across ${tpsLoo.n} points. ` +
        `Points flagged red in the "TPS LOO(px)" column are ones the fit can't predict from their neighbors — ` +
        `likely a noisy/mislabeled point, or one forcing a sharp local bend.</div>`
      : included.length > TPS_LOO_MAX_POINTS
        ? `<div style="margin-top:6px; color:#888;">TPS leave-one-out check skipped — too many points (${included.length} > ${TPS_LOO_MAX_POINTS}) to refit per-point live.</div>`
        : `<div style="margin-top:6px; color:#888;">Need at least 5 included points for the TPS leave-one-out overfit check.</div>`);

  document.getElementById('useLinearBtn').className = recommendLinear ? 'primary' : 'secondary';
  document.getElementById('warpBtn').className = recommendLinear ? 'secondary' : 'primary';

  renderPtsTable();
  updateWarpEnabled();
}

function updateWarpEnabled() {
  const n = points.filter(p => p.include).length;
  document.getElementById('warpBtn').disabled = !(srcImg && n >= 4);
  document.getElementById('useLinearBtn').disabled = !(srcImg && n >= 3 && fitReport);
}

// ─────────────────────────── thin plate spline ───────────────────────────
function tpsBasis(r2) {
  if (r2 < 1e-12) return 0;
  return r2 * Math.log(r2) * 0.5; // 0.5*r^2*ln(r^2) == r^2*ln(r)
}

// Solve (A x = B) via Gaussian elimination with partial pivoting.
// A: n x n array of arrays. B: n x m array of arrays (multiple RHS columns). Mutates copies.
function solveLinear(Ain, Bin) {
  const n = Ain.length;
  const m = Bin[0].length;
  const A = Ain.map(row => row.slice());
  const B = Bin.map(row => row.slice());

  for (let col = 0; col < n; col++) {
    let piv = col;
    let maxAbs = Math.abs(A[col][col]);
    for (let r = col + 1; r < n; r++) {
      if (Math.abs(A[r][col]) > maxAbs) { maxAbs = Math.abs(A[r][col]); piv = r; }
    }
    if (piv !== col) {
      [A[col], A[piv]] = [A[piv], A[col]];
      [B[col], B[piv]] = [B[piv], B[col]];
    }
    const pivVal = A[col][col] || 1e-12;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = A[r][col] / pivVal;
      if (factor === 0) continue;
      for (let c = col; c < n; c++) A[r][c] -= factor * A[col][c];
      for (let c = 0; c < m; c++) B[r][c] -= factor * B[col][c];
    }
  }
  const X = [];
  for (let r = 0; r < n; r++) {
    const row = [];
    for (let c = 0; c < m; c++) row.push(B[r][c] / (A[r][r] || 1e-12));
    X.push(row);
  }
  return X; // n x m
}

// Fit TPS mapping domain (lon,lat) -> [px,py] simultaneously.
// Returns { w: [[wx,wy],...], a: [[a0x,a0y],[a1x,a1y],[a2x,a2y]], pts: [[lon,lat],...] }
function fitTps(pts) {
  const n = pts.length;
  const size = n + 3;
  const M = Array.from({ length: size }, () => new Array(size).fill(0));
  const RHS = Array.from({ length: size }, () => [0, 0]);

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      const dx = pts[i].lon - pts[j].lon;
      const dy = pts[i].lat - pts[j].lat;
      M[i][j] = tpsBasis(dx * dx + dy * dy);
    }
    M[i][n] = 1; M[i][n + 1] = pts[i].lon; M[i][n + 2] = pts[i].lat;
    M[n][i] = 1; M[n + 1][i] = pts[i].lon; M[n + 2][i] = pts[i].lat;
    RHS[i][0] = pts[i].px;
    RHS[i][1] = pts[i].py;
  }

  const X = solveLinear(M, RHS); // (n+3) x 2
  const w = X.slice(0, n);
  const a = X.slice(n, n + 3);
  return { w, a, pts };
}

function tpsEval(fit, lon, lat) {
  let px = fit.a[0][0] + fit.a[1][0] * lon + fit.a[2][0] * lat;
  let py = fit.a[0][1] + fit.a[1][1] * lon + fit.a[2][1] * lat;
  for (let j = 0; j < fit.pts.length; j++) {
    const dx = lon - fit.pts[j].lon;
    const dy = lat - fit.pts[j].lat;
    const b = tpsBasis(dx * dx + dy * dy);
    if (b !== 0) {
      px += fit.w[j][0] * b;
      py += fit.w[j][1] * b;
    }
  }
  return [px, py];
}

// Leave-one-out cross-validation for the TPS fit. TPS interpolates its control
// points EXACTLY — direct residual is ~0 for every point by construction, so
// it can never reveal an over-fit/wiggly surface (the spline equivalent of a
// high-order polynomial threading every data point while whipsawing between
// them). LOOCV instead refits TPS with each point held out in turn, then
// checks how far the surface's own *prediction* at that point's (lon,lat)
// lands from where the point actually is. A point the rest of the surface
// can't predict is either noisy/mislabeled, or is forcing a sharp local bend
// to hit it exactly — the real "iffy point" signal.
const TPS_LOO_MAX_POINTS = 200; // guard against O(n^4) blowup on very large point sets
function computeTpsLoo(included) {
  const n = included.length;
  if (n < 5 || n > TPS_LOO_MAX_POINTS) return null;
  const results = new Array(n);
  for (let i = 0; i < n; i++) {
    const subset = included.slice(0, i).concat(included.slice(i + 1));
    const fit = fitTps(subset);
    const [px, py] = tpsEval(fit, included[i].lon, included[i].lat);
    results[i] = Math.hypot(px - included[i].px, py - included[i].py);
  }
  return results;
}

// ─────────────────────────── warp ───────────────────────────
document.getElementById('warpBtn').addEventListener('click', () => {
  const included = points.filter(p => p.include);
  if (!srcImg || included.length < 4) return;

  const north = parseFloat(document.getElementById('bboxN').value);
  const south = parseFloat(document.getElementById('bboxS').value);
  const west  = parseFloat(document.getElementById('bboxW').value);
  const east  = parseFloat(document.getElementById('bboxE').value);
  const outW  = Math.round(parseFloat(document.getElementById('outW').value));

  if (!(north > south) || !(east > west) || !(outW > 10)) {
    statusEl.textContent = 'Check bounding box / output width values.';
    return;
  }

  const pxPerDeg = outW / (east - west);
  const outH = Math.round((north - south) * pxPerDeg);

  const fit = fitTps(included);

  resultCanvas = document.createElement('canvas');
  resultCanvas.width = outW;
  resultCanvas.height = outH;
  const rctx = resultCanvas.getContext('2d');
  const outData = rctx.createImageData(outW, outH);

  const sw = srcImageData.width, sh = srcImageData.height, sdata = srcImageData.data;
  const odata = outData.data;

  document.getElementById('warpBtn').disabled = true;
  document.getElementById('useLinearBtn').disabled = true;
  document.getElementById('downloadBtn').disabled = true;
  const progWrap = document.getElementById('progressWrap');
  const progBar = document.getElementById('progressBar');
  progWrap.style.display = 'block';

  let y = 0;
  const rowsPerChunk = 8;

  function processChunk() {
    const yEnd = Math.min(y + rowsPerChunk, outH);
    for (; y < yEnd; y++) {
      const lat = north - (y / pxPerDeg);
      for (let x = 0; x < outW; x++) {
        const lon = west + (x / pxPerDeg);
        const [sx, sy] = tpsEval(fit, lon, lat);

        const oi = (y * outW + x) * 4;
        if (sx < 0 || sy < 0 || sx > sw - 1 || sy > sh - 1) {
          odata[oi + 3] = 0;
          continue;
        }
        const x0 = Math.floor(sx), y0 = Math.floor(sy);
        const x1 = Math.min(x0 + 1, sw - 1), y1 = Math.min(y0 + 1, sh - 1);
        const fx = sx - x0, fy = sy - y0;

        const i00 = (y0 * sw + x0) * 4;
        const i10 = (y0 * sw + x1) * 4;
        const i01 = (y1 * sw + x0) * 4;
        const i11 = (y1 * sw + x1) * 4;

        for (let ch = 0; ch < 4; ch++) {
          const top = sdata[i00 + ch] * (1 - fx) + sdata[i10 + ch] * fx;
          const bot = sdata[i01 + ch] * (1 - fx) + sdata[i11 + ch] * fx;
          odata[oi + ch] = top * (1 - fy) + bot * fy;
        }
      }
    }
    progBar.style.width = `${Math.round((y / outH) * 100)}%`;
    statusEl.textContent = `Warping... ${Math.round((y / outH) * 100)}% (${outW}x${outH})`;

    if (y < outH) {
      requestAnimationFrame(processChunk);
    } else {
      rctx.putImageData(outData, 0, 0);
      resultBounds = { north, south, west, east, pxPerDeg, w: outW, h: outH };
      currentBitmap = resultCanvas;
      fitView();
      updateWarpEnabled();
      document.getElementById('downloadBtn').disabled = false;
      progWrap.style.display = 'none';
      statusEl.textContent =
        `Done. ${outW}x${outH}px, ${pxPerDeg.toFixed(1)} px/degree, bbox N${north} S${south} W${west} E${east}. ` +
        `Fitted with ${included.length} of ${points.length} points.`;
    }
  }
  requestAnimationFrame(processChunk);
});

// ─────────────────────────── linear (unresampled) path ───────────────────────────
document.getElementById('useLinearBtn').addEventListener('click', () => {
  if (!fitReport || !srcImg) return;
  const { lonFit, latFit, rmsPx, pctSpan } = fitReport;
  const w = srcImageData.width, h = srcImageData.height;
  const west = lonFit.a;
  const east = lonFit.a + lonFit.b * w;
  const north = latFit.a;
  const south = latFit.a + latFit.b * h;

  if (!(east > west) || !(north > south)) {
    statusEl.textContent = 'Linear fit produced an invalid bounding box — check control points for sign/order errors.';
    return;
  }

  const pxPerDeg = w / (east - west);
  const included = points.filter(p => p.include).length;

  resultCanvas = null; // no resample — export the source image as-is
  resultBounds = { north, south, west, east, pxPerDeg, w, h };
  currentBitmap = srcCtx.canvas;
  fitView();
  document.getElementById('downloadBtn').disabled = false;
  statusEl.textContent =
    `Using original image unresampled (${w}x${h}px, ${pxPerDeg.toFixed(1)} px/degree). ` +
    `Linear fit RMS ${rmsPx.toFixed(1)}px (${pctSpan.toFixed(2)}%) from ${included} of ${points.length} points.`;
});

document.getElementById('graticule').addEventListener('change', renderView);

document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!resultBounds) return;

  if (resultCanvas) {
    resultCanvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'unprojected.png';
      a.click();
    });
  } else if (srcImgFile) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(srcImgFile);
    a.download = srcImgFile.name;
    a.click();
  }

  // Sidecar georeference file — lets digitizer.html auto-load the pixel<->degree
  // conversion instead of requiring manual bbox entry.
  const geo = {
    north: resultBounds.north,
    south: resultBounds.south,
    west: resultBounds.west,
    east: resultBounds.east,
    width: resultBounds.w,
    height: resultBounds.h,
    pxPerDeg: resultBounds.pxPerDeg,
  };
  const geoBlob = new Blob([JSON.stringify(geo, null, 2)], { type: 'application/json' });
  const ga = document.createElement('a');
  ga.href = URL.createObjectURL(geoBlob);
  ga.download = 'unprojected.geo.json';
  ga.click();
});
</script>
</body>
