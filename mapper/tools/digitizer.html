<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digitizer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #1e1e1e;
    color: #eee;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #left {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #toolbar {
    padding: 8px 12px;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid #444;
  }
  #toolbar label.filebtn {
    background: #3a6ea5;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  #toolbar label.filebtn:hover { background: #4a7eb5; }
  #toolbar input[type=file] { display: none; }
  #toolbar .zoomBtn {
    background: #3a3a3a;
    color: #eee;
    border: 1px solid #555;
    width: 26px;
    height: 26px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  #toolbar .zoomBtn:hover { background: #4a4a4a; }
  #zoomLabel { font-size: 12px; color: #aaa; min-width: 38px; text-align: center; }
  #toolbar .chk { font-size: 12px; color: #ccc; display: flex; align-items: center; gap: 4px; }
  #readout {
    font-family: monospace;
    font-size: 13px;
    color: #9cdcfe;
    margin-left: auto;
  }
  #canvasWrap {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background:
      repeating-conic-gradient(#2b2b2b 0% 25%, #232323 0% 50%) 50% / 20px 20px;
  }
  canvas#view {
    position: absolute;
    top: 0;
    left: 0;
    cursor: crosshair;
  }
  #hint {
    padding: 4px 12px;
    font-size: 12px;
    color: #999;
    background: #2a2a2a;
    border-top: 1px solid #444;
  }
  #right {
    width: 360px;
    flex: 0 0 auto;
    background: #252525;
    border-left: 1px solid #444;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .section {
    padding: 10px 12px;
    border-bottom: 1px solid #3a3a3a;
  }
  .section h3 {
    margin: 0 0 8px 0;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #999;
  }
  .row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  .row label { flex: 0 0 80px; font-size: 12px; color: #ccc; }
  .row input[type=number], .row input[type=text] {
    flex: 1 1 auto;
    background: #1e1e1e;
    border: 1px solid #444;
    color: #eee;
    padding: 4px 6px;
    border-radius: 3px;
    font-size: 12px;
  }
  #geoInfo { font-size: 11px; color: #888; margin-top: 4px; }
  #geoWarning {
    font-size: 11px;
    color: #e0b040;
    margin-top: 4px;
    display: none;
  }
  #pointPickerPanel {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
  }
</style>
</head>
<body>

<div id="left">
  <div id="toolbar">
    <label class="filebtn">Load Image
      <input type="file" id="imgInput" accept="image/*">
    </label>
    <label class="filebtn">Load Georef JSON
      <input type="file" id="geoInput" accept=".json,application/json">
    </label>
    <span id="imgInfo" style="color:#aaa; font-size:12px;"></span>
    <button class="zoomBtn" id="zoomOutBtn" title="Zoom out one step">−</button>
    <span id="zoomLabel"></span>
    <button class="zoomBtn" id="zoomInBtn" title="Zoom in one step">+</button>
    <label class="chk"><input type="checkbox" id="showLabelsChk" checked> Numbers</label>
    <span id="readout">—</span>
  </div>
  <div id="canvasWrap">
    <canvas id="view"></canvas>
  </div>
  <div id="hint">
    Click = add point &nbsp;|&nbsp; Drag = pan &nbsp;|&nbsp; Scroll/+/− = zoom (stepped) &nbsp;|&nbsp;
    Arrow keys = nudge active (yellow) point 1px &nbsp;|&nbsp; Click a table row = select it as active &nbsp;|&nbsp;
    Double-click = fit to window
  </div>
</div>

<div id="right">
  <div class="section">
    <h3>Georeference</h3>
    <div class="row"><label>North lat</label><input type="number" id="gN" value="40" step="0.0001"></div>
    <div class="row"><label>South lat</label><input type="number" id="gS" value="35.6" step="0.0001"></div>
    <div class="row"><label>West lon</label><input type="number" id="gW" value="-9.6" step="0.0001"></div>
    <div class="row"><label>East lon</label><input type="number" id="gE" value="-0.3" step="0.0001"></div>
    <div id="geoInfo">Load an image to compute px/degree.</div>
    <div id="geoWarning"></div>
  </div>

  <div id="pointPickerPanel"></div>
</div>

<script src="../js/pointpicker.js"></script>
<script>
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const statusReadout = document.getElementById('readout');

let img = null, imgW = 0, imgH = 0;
let viewScale = 1, viewOffX = 0, viewOffY = 0;
let showLabels = true;

document.getElementById('showLabelsChk').addEventListener('change', (e) => {
  showLabels = e.target.checked;
  render();
});

// ── georeference ──────────────────────────────────────────────────────────
const gN = document.getElementById('gN');
const gS = document.getElementById('gS');
const gW = document.getElementById('gW');
const gE = document.getElementById('gE');
const geoInfo = document.getElementById('geoInfo');
const geoWarning = document.getElementById('geoWarning');

function geoBounds() {
  return {
    north: parseFloat(gN.value),
    south: parseFloat(gS.value),
    west: parseFloat(gW.value),
    east: parseFloat(gE.value),
  };
}

function pxPerDeg() {
  const { west, east } = geoBounds();
  return imgW / (east - west);
}

function pixelToLonLat(px, py) {
  const { north, west } = geoBounds();
  const ppd = pxPerDeg();
  return { lon: west + px / ppd, lat: north - py / ppd };
}

function lonLatToPixel(lon, lat) {
  const { north, west } = geoBounds();
  const ppd = pxPerDeg();
  return { px: (lon - west) * ppd, py: (north - lat) * ppd };
}

const pointPicker = new PointPicker({
  container: document.getElementById('pointPickerPanel'),
  converter: {
    pixelToLonLat,
    lonLatToPixel,
    // Keep nudges from walking a point off the source image's edge.
    clampPixel: (px, py) => ({ px: Math.max(0, Math.min(imgW, px)), py: Math.max(0, Math.min(imgH, py)) }),
  },
  dbNamespace: 'digitizer',
  onChange: () => render(),
  onSelect: (p) => centerOn(p),
});

function updateGeoInfo() {
  if (!imgW) { geoInfo.textContent = 'Load an image to compute px/degree.'; return; }
  const { north, south, west, east } = geoBounds();
  const ppd = pxPerDeg();
  geoInfo.textContent = `${imgW}x${imgH}px — ${ppd.toFixed(2)} px/degree`;

  const expectedH = (north - south) * ppd;
  const diffPct = Math.abs(expectedH - imgH) / imgH * 100;
  if (diffPct > 1) {
    geoWarning.style.display = 'block';
    geoWarning.textContent =
      `Warning: bbox implies height ${expectedH.toFixed(0)}px but image is ${imgH}px ` +
      `(${diffPct.toFixed(1)}% off). Double-check North/South/West/East.`;
  } else {
    geoWarning.style.display = 'none';
  }
  render();
}
[gN, gS, gW, gE].forEach(el => el.addEventListener('input', updateGeoInfo));

document.getElementById('geoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const geo = JSON.parse(reader.result);
      gN.value = geo.north; gS.value = geo.south; gW.value = geo.west; gE.value = geo.east;
      updateGeoInfo();
    } catch (err) {
      alert('Could not parse georeference JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
});

// ── image loading ───────────────────────────────────────────────────────────
document.getElementById('imgInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const image = new Image();
  image.onload = () => {
    img = image;
    imgW = image.naturalWidth;
    imgH = image.naturalHeight;
    document.getElementById('imgInfo').textContent = `${file.name} — ${imgW}x${imgH}px`;
    fitView();
    updateGeoInfo();
    URL.revokeObjectURL(url);
  };
  image.src = url;
});

// ── view transform (pan/zoom, display-only — never affects px/deg math) ────
function resizeView() {
  view.width = wrap.clientWidth;
  view.height = wrap.clientHeight;
  render();
}
window.addEventListener('resize', resizeView);
resizeView();

function fitView() {
  if (!img) return;
  const availW = wrap.clientWidth * 0.94;
  const availH = wrap.clientHeight * 0.94;
  viewScale = Math.min(availW / imgW, availH / imgH, 1);
  viewOffX = (wrap.clientWidth - imgW * viewScale) / 2;
  viewOffY = (wrap.clientHeight - imgH * viewScale) / 2;
  render();
}

function imgToScreen(px, py) { return [px * viewScale + viewOffX, py * viewScale + viewOffY]; }
function screenToImg(sx, sy) { return [(sx - viewOffX) / viewScale, (sy - viewOffY) / viewScale]; }

// ── discrete zoom levels (MAPPER-style step zoom, not continuous) ──────────
const ZOOM_LEVELS = [0.02, 0.03, 0.05, 0.08, 0.12, 0.18, 0.25, 0.35, 0.5, 0.7,
                      1, 1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22, 32, 40];

function nearestZoomIndex(scale) {
  let best = 0, bestDist = Infinity;
  ZOOM_LEVELS.forEach((v, i) => {
    const d = Math.abs(Math.log(v) - Math.log(scale));
    if (d < bestDist) { bestDist = d; best = i; }
  });
  return best;
}

function setZoomTo(newScale, anchorSx, anchorSy) {
  if (anchorSx === undefined) { anchorSx = view.width / 2; anchorSy = view.height / 2; }
  const [ix, iy] = screenToImg(anchorSx, anchorSy);
  viewScale = newScale;
  viewOffX = anchorSx - ix * viewScale;
  viewOffY = anchorSy - iy * viewScale;
  render();
}

function zoomStep(delta, anchorSx, anchorSy) {
  if (!img) return;
  const idx = nearestZoomIndex(viewScale);
  const newIdx = Math.max(0, Math.min(ZOOM_LEVELS.length - 1, idx + delta));
  setZoomTo(ZOOM_LEVELS[newIdx], anchorSx, anchorSy);
}

function updateZoomLabel() {
  const lbl = document.getElementById('zoomLabel');
  lbl.textContent = img ? `${Math.round(viewScale * 100)}%` : '';
}

document.getElementById('zoomInBtn').addEventListener('click', () => zoomStep(1));
document.getElementById('zoomOutBtn').addEventListener('click', () => zoomStep(-1));

// Label offset: point away from the direction of travel through this point,
// so the number sits clear of the path instead of getting buried under it.
function labelOffset(i) {
  const pts = pointPicker.points;
  const cur = lonLatToPixel(pts[i].lon, pts[i].lat);
  let dx, dy;
  if (pts[i - 1]) {
    const prev = lonLatToPixel(pts[i - 1].lon, pts[i - 1].lat);
    dx = cur.px - prev.px; dy = cur.py - prev.py;
  } else if (pts[i + 1]) {
    const next = lonLatToPixel(pts[i + 1].lon, pts[i + 1].lat);
    dx = next.px - cur.px; dy = next.py - cur.py;
  } else { dx = 1; dy = -1; }
  const len = Math.hypot(dx, dy) || 1;
  const off = 9;
  return { ox: -dx / len * off, oy: -dy / len * off };
}

function render() {
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.clearRect(0, 0, view.width, view.height);
  updateZoomLabel();
  if (!img) return;
  vctx.imageSmoothingEnabled = viewScale < 1;
  vctx.drawImage(img, viewOffX, viewOffY, imgW * viewScale, imgH * viewScale);

  pointPicker.points.forEach((p, i) => {
    const { px, py } = lonLatToPixel(p.lon, p.lat);
    const [sx, sy] = imgToScreen(px, py);
    const isActive = p.id === pointPicker.activeId;
    vctx.beginPath();
    vctx.arc(sx, sy, isActive ? 3 : 2, 0, Math.PI * 2);
    vctx.fillStyle = isActive ? '#ffcc33' : '#ff4444';
    vctx.fill();
    vctx.strokeStyle = '#fff';
    vctx.lineWidth = 1;
    vctx.stroke();
    if (showLabels) {
      const { ox, oy } = labelOffset(i);
      vctx.fillStyle = '#fff';
      vctx.font = 'bold 11px monospace';
      vctx.textAlign = ox >= 0 ? 'left' : 'right';
      vctx.textBaseline = oy >= 0 ? 'top' : 'bottom';
      vctx.fillText(String(i + 1), sx + ox, sy + oy);
    }
  });
  vctx.textAlign = 'start';
  vctx.textBaseline = 'alphabetic';
}

// pan / zoom / click-to-add
let dragging = false, dragMoved = false, dragStart = [0, 0];

view.addEventListener('mousedown', (e) => {
  dragging = true;
  dragMoved = false;
  dragStart = [e.clientX, e.clientY];
});

window.addEventListener('mousemove', (e) => {
  const rect = view.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  if (img) {
    const [ix, iy] = screenToImg(sx, sy);
    if (ix >= 0 && iy >= 0 && ix <= imgW && iy <= imgH) {
      const { lon, lat } = pixelToLonLat(ix, iy);
      statusReadout.textContent = `px: ${ix.toFixed(1)}, ${iy.toFixed(1)}  |  lon: ${lon.toFixed(5)}, lat: ${lat.toFixed(5)}`;
    } else {
      statusReadout.textContent = '—';
    }
  }
  if (dragging) {
    const dx = e.clientX - dragStart[0];
    const dy = e.clientY - dragStart[1];
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    if (dragMoved) {
      viewOffX += e.movementX;
      viewOffY += e.movementY;
      render();
    }
  }
});

window.addEventListener('mouseup', (e) => {
  if (dragging && !dragMoved && img) {
    const rect = view.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    if (sx >= 0 && sy >= 0 && sx <= view.width && sy <= view.height) {
      const [ix, iy] = screenToImg(sx, sy);
      if (ix >= 0 && iy >= 0 && ix <= imgW && iy <= imgH) {
        pointPicker.addPointFromPixel(ix, iy);
      }
    }
  }
  dragging = false;
  dragMoved = false;
});

// Trackpad pinch-zoom fires many small-delta wheel events in a burst; stepping
// on every one felt erratic (and could overshoot back to the fit-to-window
// scale). Accumulate delta and only spend one discrete zoom level per
// threshold crossed, same idea as MAPPER's stepped zoom.
let zoomAccum = 0;
view.addEventListener('wheel', (e) => {
  if (!img) return;
  e.preventDefault();
  const rect = view.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  zoomAccum += e.deltaY;
  const THRESH = 50;
  while (Math.abs(zoomAccum) >= THRESH) {
    zoomStep(zoomAccum > 0 ? -1 : 1, sx, sy);
    zoomAccum -= Math.sign(zoomAccum) * THRESH;
  }
}, { passive: false });

wrap.addEventListener('dblclick', fitView);

// ── arrow-key nudge (1 image pixel, active point only) ──────────────────────
window.addEventListener('keydown', (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  if (!pointPicker.getActivePoint()) return;

  e.preventDefault();
  const dx = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  const dy = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0;
  pointPicker.nudgeActive(dx, dy);
});

function centerOn(p) {
  const { px, py } = lonLatToPixel(p.lon, p.lat);
  viewOffX = view.width / 2 - px * viewScale;
  viewOffY = view.height / 2 - py * viewScale;
  render();
}

updateGeoInfo();
</script>
</body>
</html>
